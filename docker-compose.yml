services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"

  gui:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:7860"
    environment:
      - PORT=7860
      - DECODER_MODE=api
      - API_URL=http://api:8000
    depends_on:
      - api
